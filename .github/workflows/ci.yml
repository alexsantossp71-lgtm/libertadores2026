name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        run: |
          pip install -r requirements-dev.txt ruff
          pip install -e .

      - name: Lint (ruff)
        run: ruff check src/ tests/ app.py pages/

      - name: Testes
        run: pytest tests/ -q
