[server]
# Configuração segura por padrão (CORS/XSRF habilitados).
# Para preview local atrás de proxy, sobrescreva via CLI:
#   streamlit run app.py --server.enableCors=false --server.enableXsrfProtection=false
address = "0.0.0.0"
port = 8501
headless = true
enableCORS = true
enableXsrfProtection = true
enableWebsocketCompression = false
fileWatcherType = "auto"

[browser]
gatherUsageStats = false

[theme]
base = "dark"
primaryColor = "#12a05c"
backgroundColor = "#0b1512"
secondaryBackgroundColor = "#10261c"
textColor = "#e8f2ec"
font = "sans serif"
